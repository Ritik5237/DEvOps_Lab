apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-docker-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-docker-app

  template:
    metadata:
      labels:
        app: my-docker-app

    spec:
      containers:
        - name: my-docker-app
          image: ritiksharma523/my-docker-app:1.0
          ports:
            - containerPort: 80

