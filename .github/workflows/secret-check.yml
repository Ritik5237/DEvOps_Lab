name: Secure Secret Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'lab4exp6/**'
      - '.github/workflows/secret-check.yml'

jobs:
  security-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab4exp6

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Verify Secrets
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -n "$APP_USERNAME" ] && [ -n "$APP_PASSWORD" ]; then
            echo "Secrets loaded successfully"
          else
            echo "Required secrets are missing"
            exit 1
          fi
